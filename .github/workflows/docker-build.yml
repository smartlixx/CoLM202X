# .github/workflows/docker-build.yml
name: Build & Push CoLM Dev Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to build'
        required: true
        default: 'main'
  push:
    branches: [ main master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main master ]

permissions:
  contents: read
  packages: write           # required for pushing to GHCR

env:
  # ── Registry choice（1 out of 2） ──────────────────────────────
  # Option A: GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # automatically change to ghcr.io/owner/repo

  # Option B: Docker Hub（uncomment below and set up secrets）
  # REGISTRY: docker.io
  # IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/colm-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      # ── log on to registry ──────────────────────────────
      - name: 🔐 Log in to GHCR
        if: github.event_name != 'pull_request'   # PR 时不推送
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If use Docker Hub，uncomment these and set up secrets
      # - name: 🔐 Log in to Docker Hub
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ vars.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── meta ────────────────────
      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}

      # ── Set up Docker Buildx ────────────────
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and push ─────────────────────────────────────
      - name: 🏗️ Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
